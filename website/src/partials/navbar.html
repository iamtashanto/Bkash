<!-- Skip to main content for accessibility -->
<a
  href="#main-content"
  class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-accent-600 focus:text-white focus:rounded-md focus:shadow-lg"
>
  Skip to main content
</a>

<!-- Release notice -->
<aside
  aria-label="Release notice"
  class="w-full bg-amber-500/10 border-b border-amber-500/20 text-amber-900 dark:text-amber-200 px-4 py-2 text-xs sm:text-sm font-medium"
>
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span
        class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-700 dark:text-amber-300"
      >
        v0.1.0
      </span>
      <span
        data-en="First release. Not yet validated end to end against the live bKash gateway; see the feature status."
        data-bn="প্রথম রিলিজ। লাইভ বিকাশ গেটওয়েতে এখনো সম্পূর্ণ যাচাই করা হয়নি; ফিচার স্ট্যাটাস দেখুন।"
      >
        First release. Not yet validated end to end against the live bKash
        gateway; see the feature status.
      </span>
    </div>
    <a
      href="https://github.com/iamtashanto/Bkash"
      target="_blank"
      rel="noopener noreferrer"
      class="hover:underline hidden sm:inline-flex items-center gap-1 font-semibold"
    >
      GitHub Roadmap &rarr;
    </a>
  </div>
</aside>

<!-- Main Header / Navbar -->
<header
  class="sticky top-0 z-40 w-full border-b border-border-subtle bg-surface/90 backdrop-blur-md"
>
  <div
    class="max-w-7xl mx-auto flex h-16 items-center justify-between px-4 sm:px-6 lg:px-8"
  >
    <!-- Logo & Project Wordmark -->
    <div class="flex items-center gap-6">
      <a
        href="{{BASE_PATH}}"
        class="flex items-center gap-2.5 group focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-primary rounded-lg p-1"
      >
        <!-- Custom Wordmark Icon (Fintech node shield, no trademark bKash logo) -->
        <div
          class="w-9 h-9 rounded-xl bg-accent-primary text-white flex items-center justify-center font-bold shadow-card group-hover:scale-105 transition-transform duration-150"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5zM12 11a2.5 2.5 0 100-5 2.5 2.5 0 000 5zm0 2c-2.33 0-7 1.17-7 3.5V18h14v-1.5c0-2.33-4.67-3.5-7-3.5z"
            />
          </svg>
        </div>
        <div class="flex flex-col">
          <span
            class="text-base sm:text-lg font-bold tracking-tight text-txt-primary flex items-center gap-1.5"
          >
            bkash<span class="text-accent-primary">.sdk</span>
            <span
              class="text-[10px] uppercase font-mono tracking-wider px-1.5 py-0.5 rounded bg-surface-elevated text-txt-muted border border-border-subtle"
            >
              unofficial
            </span>
          </span>
        </div>
      </a>

      <!-- Desktop Nav Links -->
      <nav
        class="hidden md:flex items-center gap-1 ml-4"
        aria-label="Main Navigation"
      >
        <a
          href="{{BASE_PATH}}"
          class="px-3 py-1.5 text-sm font-medium rounded-md text-accent-primary bg-accent-subtle"
          aria-current="page"
        >
          Home
        </a>
        <a
          href="{{BASE_PATH}}docs/"
          class="px-3 py-1.5 text-sm font-medium rounded-md text-txt-secondary hover:text-txt-primary hover:bg-surface-elevated transition-colors"
        >
          Docs
        </a>
        <a
          href="{{BASE_PATH}}#quickstart"
          class="px-3 py-1.5 text-sm font-medium rounded-md text-txt-secondary hover:text-txt-primary hover:bg-surface-elevated transition-colors"
        >
          Quickstart
        </a>
        <a
          href="{{BASE_PATH}}#architecture"
          class="px-3 py-1.5 text-sm font-medium rounded-md text-txt-secondary hover:text-txt-primary hover:bg-surface-elevated transition-colors"
        >
          Architecture
        </a>
        <a
          href="{{BASE_PATH}}#status"
          class="px-3 py-1.5 text-sm font-medium rounded-md text-txt-secondary hover:text-txt-primary hover:bg-surface-elevated transition-colors"
        >
          Feature Status
        </a>
      </nav>
    </div>

    <!-- Controls (Theme, Language, GitHub) -->
    <div class="flex items-center gap-3">
      <!-- Bangla / English Language Toggle -->
      <button
        id="lang-toggle-btn"
        type="button"
        aria-label="Switch between English and Bangla"
        class="inline-flex items-center justify-center px-2.5 py-1.5 rounded-lg border border-border-subtle bg-surface hover:bg-surface-elevated text-xs font-semibold text-txt-secondary hover:text-txt-primary transition-colors focus-visible:ring-2 focus-visible:ring-accent-primary"
      >
        <span id="lang-label" class="font-mono">BN</span>
      </button>

      <!-- Dark / Light Theme Toggle -->
      <button
        id="theme-toggle-btn"
        type="button"
        aria-label="Toggle dark mode"
        class="inline-flex items-center justify-center w-9 h-9 rounded-lg border border-border-subtle bg-surface hover:bg-surface-elevated text-txt-secondary hover:text-txt-primary transition-colors focus-visible:ring-2 focus-visible:ring-accent-primary"
      >
        <!-- Sun Icon (shown in dark mode) -->
        <svg
          id="sun-icon"
          class="w-4 h-4 hidden"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
          />
        </svg>
        <!-- Moon Icon (shown in light mode) -->
        <svg
          id="moon-icon"
          class="w-4 h-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
          />
        </svg>
      </button>

      <!-- GitHub Link -->
      <a
        href="https://github.com/iamtashanto/Bkash"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub Repository"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-border-subtle bg-surface hover:bg-surface-elevated text-xs sm:text-sm font-semibold text-txt-primary transition-colors focus-visible:ring-2 focus-visible:ring-accent-primary"
      >
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
          />
        </svg>
        <span class="hidden sm:inline">GitHub</span>
      </a>
    </div>
  </div>
</header>
