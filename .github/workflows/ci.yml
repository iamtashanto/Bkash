name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test-build:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
        os: [ubuntu-latest]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run Tests
        run: pnpm run test

      - name: Build Packages
        run: pnpm run build

      - name: Packaging Lint (publint)
        run: |
          npx -y publint packages/bkash-server
          npx -y publint packages/bkash-client

      - name: Type Resolution Verification (attw)
        # attw crashes on Node 18 ("Cannot read properties of undefined (reading 'filename')"); it only inspects the packed files.
        if: matrix.node-version != 18
        run: |
          npx -y @arethetypeswrong/cli --pack packages/bkash-server
          npx -y @arethetypeswrong/cli --pack packages/bkash-client

      - name: Status tables are up to date
        run: node website/scripts/gen-status.mjs --check

      - name: Build Documentation Website
        run: pnpm run build:website

      - name: Validate Documentation Website
        run: pnpm run check:website
