name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test-build:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
        os: [ubuntu-latest]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@cca674514a6015569d651bc5239e032541a704e6 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc70b720a8f335c1bb777582f322 # v4.0.0
        with:
          run_install: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@1e60f63c7bc0455ca347c74ed8449c2847c1f964 # v4.0.3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run Tests
        run: pnpm run test

      - name: Build Packages
        run: pnpm run build

      - name: Packaging Lint (publint)
        run: |
          npx -y publint packages/bkash-server
          npx -y publint packages/bkash-client

      - name: Type Resolution Verification (attw)
        run: |
          npx -y @arethetypeswrong/cli --pack packages/bkash-server
          npx -y @arethetypeswrong/cli --pack packages/bkash-client

      - name: Validate Documentation Website
        run: pnpm run check:website
